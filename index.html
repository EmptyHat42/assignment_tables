<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabeller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Övningstabell</h1>
    </header>
    
    <table> <!-- Definierar vår tabell -->
        <thead> <!-- Definierar vårt tabellhuvud -->
            <tr> <!--Definierar en tabellrad -->
                <th>Namn</th> <!-- Definierar en rubrikcell -->
                <th>År</th>
                <th>Klockfrekvens</th>
                <th>Antal transistorer</th>
            </tr>
        </thead>
        <tbody> <!-- Definierar vår tabellinfo -->
            <tr>
                <td>Intel 8088</td> <!-- Definierar en datacell i tabellen-->
                <td>1979</td>
                <td>4,77 MHz</td>
                <td>29 000</td>
            </tr>
            <tr>
                <td>Intel 80386DX</td>
                <td>1985</td>
                <td>16 MHz</td>
                <td>275 000</td>
            </tr>
            <tr>
                <td>Pentium</td>
                <td>1993</td>
                <td>60 MHz</td>
                <td>3 100 000</td>
            </tr>
            <tr>
                <td>Core i7</td>
                <td>2008</td>
                <td>3,33 GHz</td>
                <td>781 000 000</td>
            </tr>
        </tbody>
        <caption>Intelprocessorer</caption>
    </table>
</body>
</html>
